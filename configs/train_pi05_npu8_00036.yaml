# π0.5 on 8× Ascend 910 NPU (Atlas 800I A3, NPU 0-7) — dataset 00036，完整基座重训
# 由 16 卡 npu16 配置派生：只改「卡数相关的三处」——batch_size / peak_lr / 终止步数，
# 并把 warm start 基座换成完整 π0.5（原 604 张量的 PaliGemma-only 半成品导致动作专家随机初始化）。
# 派生关系（单变量对照之外的必要改动，逐条列清）：
#   batch_size  256 → 128  保持每卡 16 样本不变（HBM 实测 37.5/64GB，翻倍到 32/卡会 OOM）
#   peak_lr     1e-4 → 7e-5  沿用仓库 sqrt 规则 2.5e-5×sqrt(world)：world 16→8 ⇒ 7.07e-5
#   num_epochs  100 不变 ⇒ 394 步/ep × 100 = 39400 步，样本曝光 5.04M 与 npu16 run 完全一致
config_name: pi05_aloha
framework: pytorch

exp_name: 00036_PI05_npu8_bs128_lr7e-5_ah50_fixbase
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 128          # TOTAL across 8 NPUs = 16 per NPU
num_epochs: 100
seed: 42
num_workers: 16
log_interval: 50

save_every_epochs: null
save_interval: 2000      # ~20GB/ckpt；驻留由 scripts/huawei_ckpt_prune.sh 限制（保 10k 倍数 + 最新 3）
save_full_every_epochs: null
keep_period: 5000        # 注意：train_pytorch.py 这条路径不做裁剪，实际保留策略见 prune 脚本
overwrite: true
resume: false
wandb_enabled: false
fsdp_devices: 8
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 1000
  peak_lr: 7.0e-5         # sqrt scaling: 2.5e-5 × sqrt(8)
  decay_lr: 1.0e-5
  decay_steps: 40000      # ≈ total steps (39400)

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/00036_20260804_RM_01_yj_v21
  assets:
    assets_dir: /home/pi05/00036_20260804_RM_01_yj_v21
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
