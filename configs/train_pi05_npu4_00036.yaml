# π0.5 on 4× Ascend 910 (Atlas 800I A3, NPU 0-3) — dataset 00036，完整基座
# 推荐档（相对 8 卡 npu8 bs128 lr7e-5 ah50）：
#   world 8→4，local_bs 仍 16 ⇒ global 128→64（HBM 16/卡已测 37.5/64GB，32/卡会 OOM）
#   peak_lr 7e-5→3.5e-5  略降：AdamW 走 OpenPI √(bs/32)，不是 √卡数
#   AH 50→16            对齐 TongBot 15fps 约 1 秒包；不算速度旋钮
#   warmup 1000→2000    对齐 128k 样本（1000×128）
#   decay_lr = 0.1×peak；decay_steps = 总 step（50440//64×100 = 78800）
#   workers 16→8、save_interval 2000→500
# 优化器锁死：AdamW β=(0.9,0.95) wd=1e-10 clip=1.0 EMA=0.99 bf16
config_name: pi05_aloha
framework: pytorch

exp_name: 00036_PI05_npu4_bs64_lr3.5e-5_ah16_fixbase
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 64           # TOTAL across 4 NPUs = 16 per NPU
num_epochs: 100
seed: 42
num_workers: 8
log_interval: 50

save_every_epochs: null
save_interval: 500
save_full_every_epochs: null
keep_period: 5000
overwrite: true
resume: false
wandb_enabled: false
fsdp_devices: 4
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 16

lr_schedule:
  warmup_steps: 2000
  peak_lr: 3.5e-5         # 2.5e-5 × sqrt(64/32)；相对 8 卡 7e-5 略降
  decay_lr: 3.5e-6        # 0.1 × peak
  decay_steps: 78800      # 788 steps/ep × 100

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/00036_20260804_RM_01_yj_v21
  assets:
    assets_dir: /home/pi05/00036_20260804_RM_01_yj_v21
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
