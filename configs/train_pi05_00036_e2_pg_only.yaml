config_name: pi05_aloha
framework: pytorch
exp_name: e2_pg_only_00036
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets
batch_size: 256
num_epochs: 100
seed: 42
num_workers: 4
log_interval: 50
save_every_epochs: 10
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
