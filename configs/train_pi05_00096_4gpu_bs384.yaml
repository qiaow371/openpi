# 00096 / 4×GPU(0,13,14,15) / 沿用 00094 同款 4 卡配方（bs384、30 epoch、ah50、per-card bs 与 LR 不变）。
# 数据集 00096_20260911_RM_02_DQ_21：174 ep / 255064 帧 → 664 step/epoch，30 epoch 共 19920 步。
# warmup 4382 ≈ 6.6 epoch（与 00094 的 1334/6060 同比例）；keep_period 1328 = 每 2 epoch 存一次。
config_name: pi05_aloha
framework: pytorch
exp_name: pi05_00096_4gpu_bs384_ep30_sv2ep_20260914
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets
batch_size: 384
num_epochs: 30
seed: 42
num_workers: 8
log_interval: 100
save_every_epochs: 2
keep_period: 1328
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 4
ema_decay: 0.99
pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed
model:
  action_horizon: 50
lr_schedule:
  warmup_steps: 4382
  peak_lr: 1.5e-4
  decay_lr: 1.5e-5
optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0
data:
  repo_id: /workspace/openpi/datasets/00096_20260911_RM_02_DQ_21
  assets:
    assets_dir: /workspace/openpi/datasets/00096_20260911_RM_02_DQ_21
    asset_id: "."
  default_prompt: "Open the pink box with black handle on table, place black tissue in it, close box. Discard trash to trash-can, grab towel to wipe table."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
