# 00036 正确 e3：subtask CE 的 PG 拼回 π0.5 后，只训 Action FM（subtask 作 prompt）
# GPU 8-11
config_name: pi05_aloha
framework: pytorch
exp_name: e3_ce_then_action_00036
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets
batch_size: 256
num_epochs: 100
seed: 42
num_workers: 4
log_interval: 50
save_every_epochs: 10
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 4
ema_decay: 0.99
pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_e2_ce_spliced
trainable_modules: action
model:
  pi05: true
  action_horizon: 50
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
lr_schedule:
  warmup_steps: 2000
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0
data:
  repo_id: /workspace/openpi/datasets/00036_20260804_RM_01_yj_21
  assets:
    assets_dir: /workspace/openpi/datasets/00036_20260804_RM_01_yj_21
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
