# 旧档：RGB + 三路 DEPTH + FT（pi05_aloha_ft_depth）。
# 新实验请改用 configs/train_pi05_rgb*.yaml 矩阵（HEAD/WRIST 分开，FT 可关）。
# 见 docs/PI05_FT_DEPTH.md。
#
# 用法:
#   uv run scripts/compute_norm_stats.py --config-name pi05_aloha_ft_depth \
#       --dataset-dir /path/to/cigai20_ft_depth_lerobot
#   python scripts/train_from_yaml.py --config configs/train_pi05_ft_depth.yaml --dry-run
#
# 没点名服务器、没填下面 data.repo_id 之前不要开训。

config_name: pi05_aloha_ft_depth
framework: jax

exp_name: REPLACE_ME_ft_depth
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 32
num_epochs: 100
seed: 42
num_workers: 6
log_interval: 100
save_every_epochs: 10
save_full_every_epochs: 20
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 1
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path:

# encoder：depth 走 SigLIP（3 通道灰度并入 images），FT 走 Force6DEncoder。
# 不要改回 use_depth_encoder: true（那是独立 DepthEncoder，不是 PaliGemma SigLIP）。
model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

# 换成 cigai20-ft-depth 采出来的 LeRobot 根目录（含 observation.force6d.* 和 depth/ PNG）
data:
  repo_id: /REPLACE/ME/lerobot_ft_depth
  assets:
    assets_dir: /REPLACE/ME/lerobot_ft_depth
    asset_id: "."
  default_prompt: "REPLACE_ME"
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, -1, 7, -1]
