# gpu-node1 单卡 JAX π0.5 · 00036 按 5fps 重采样后训练
# 原始落盘 15fps；本 run 用 v2.1 子集 00036_*_fps5（一步=200ms，horizon=50 → 10s）
config_name: pi05_aloha
framework: jax
exp_name: 00036_jax_PI05_bs32_lr2.5e-5_ah50_fps5
project_name: openpi
checkpoint_base_dir: ./checkpoint
assets_base_dir: ./assets

batch_size: 32
num_epochs: 30
seed: 42
num_workers: 4
log_interval: 100
save_every_epochs: 2
save_full_every_epochs: 10
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 1
ema_decay: 0.99
pytorch_training_precision: bfloat16
pytorch_weight_path:

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 500
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/cqcigai/datasets/00036_20260804_RM_01_yj_21_fps5
  assets:
    assets_dir: /home/cqcigai/datasets/00036_20260804_RM_01_yj_21_fps5
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
