# 00068 RM_01(tong_dual_arm) / LeRobot v2.1 / 江算 PPU PyTorch π0.5
# 参数与 00062 一致

config_name: pi05_aloha
framework: pytorch

exp_name: 00068_RM01_pi05_bs512_20260817
project_name: openpi
checkpoint_base_dir: /nvme2n1/outputs/pi05_aloha
assets_base_dir: ./assets

batch_size: 512
num_epochs: 100
seed: 42
num_workers: 4
log_interval: 100
save_every_epochs: null
save_interval: 1000
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 1
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/ubuntu/lerobot/CQTongBot-train-ppu/base_model/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 500
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /nvme2n1/dataset/00068_20260817_RM_01_YJ_21
  assets:
    assets_dir: /nvme2n1/dataset/00068_20260817_RM_01_YJ_21
    asset_id: "."
  default_prompt: "Using both hands, pick up the pen box with the left hand and pick up the pen with the right hand. Place the pen into the pen box"
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
