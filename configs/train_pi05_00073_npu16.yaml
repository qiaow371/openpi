# π0.5 training on 16x Ascend 910 NPU (DDP via torchrun) - dataset 00073
# 基于验证可用的 train_pi05_npu16.yaml(00036) 改编，仅换数据集相关字段
# 00073: 630 ep / 194273 帧。bs=256 -> 759 step/epoch。num_epochs=25 -> ~18975 step
# 总样本曝光 18975*256=4.86M ≈ 00036 run 的 5.04M，预算对齐
config_name: pi05_aloha
framework: pytorch

exp_name: 00073_PI05_npu16_bs256_lr1e-4_ah50
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 256          # TOTAL across 16 NPUs = 16 per NPU
num_epochs: 25
seed: 42
num_workers: 16
log_interval: 50

save_every_epochs: null
save_interval: 1000
save_full_every_epochs: null
keep_period: 5000
overwrite: true
resume: false
wandb_enabled: false
fsdp_devices: 16
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 1000
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  decay_steps: 19000

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/00073_20260818_RM_01_yj_21
  assets:
    assets_dir: /home/pi05/00073_20260818_RM_01_yj_21
    asset_id: "."
  default_prompt: "Using both hands, pick up the courier items from the green conveyor belt. Place the white courier bags into the left box and the brown courier boxes into the right box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
