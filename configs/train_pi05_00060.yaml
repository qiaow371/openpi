# 00060 重开：每 epoch 存盘，ckpt 写 /data，不用 snap uv
config_name: pi05_aloha
framework: jax

exp_name: 00086_jax_PI05_bs32_lr2.5e-5_ah50_YJ_ZL_21
project_name: openpi
checkpoint_base_dir: /data/outputs
assets_base_dir: ./assets

batch_size: 32
num_epochs: 100
seed: 42
num_workers: 0
log_interval: 100
save_every_epochs: 1
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 1
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path:

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/cqcigai/datasets/00086_20260827_RM_01_YJ_ZL_21
  assets:
    assets_dir: /home/cqcigai/datasets/00086_20260827_RM_01_YJ_ZL_21
    asset_id: "."
  prompt_from_task: true
  default_prompt: "Using both hands, pull open the drawer with the blue handle using your left hand, take out the white medicine box with your right hand, place it into the green drawer, and finally close the drawer."
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
