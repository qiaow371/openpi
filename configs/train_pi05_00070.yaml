# 00070 cobot_magic / LeRobot v2.1 / 江算 PPU PyTorch π0.5
config_name: pi05_aloha
framework: pytorch

exp_name: 00070_agilex_pi05_bs512_box_bolt_20260817
project_name: openpi
checkpoint_base_dir: /nvme2n1/outputs/pi05_aloha
assets_base_dir: ./assets

batch_size: 512
num_epochs: 100
seed: 42
num_workers: 4
log_interval: 100
save_every_epochs: null
save_interval: 1000
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 1
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/ubuntu/lerobot/CQTongBot-train-ppu/base_model/pi05_fixed

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 200
  peak_lr: 5.0e-5
  decay_lr: 5.0e-6

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-4
  clip_gradient_norm: 1.0

data:
  repo_id: /nvme2n1/dataset/00070_20260817_agx01_gzy
  assets:
    assets_dir: /nvme2n1/dataset/00070_20260817_agx01_gzy
    asset_id: "."
  default_prompt: "Two robotic arms collaborate. One arm opens and closes the rectangular box, while the other arm locates the blue bolt among interfering black gears and nuts, then places it into the box."
  adapt_to_pi: true
  delta_action_dims: [6, -1, 6, -1]
