# π0.5 4×Ascend910 NPU 4-7 — 00036，chunk/AH=25，其余走推荐档
# bs64（16/卡）lr 3.5e-5 warmup 2000 decay 3.5e-6 workers 8 save 500
# 优化器锁死：AdamW β=(0.9,0.95) wd=1e-10 clip=1.0 EMA=0.99 bf16
config_name: pi05_aloha
framework: pytorch

exp_name: 00036_PI05_npu4_bs64_lr3.5e-5_ah25_fixbase
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 64           # TOTAL across 4 NPUs = 16 per NPU
num_epochs: 100
seed: 42
num_workers: 8
log_interval: 50

save_every_epochs: null
save_interval: 500
save_full_every_epochs: null
keep_period: 5000
overwrite: true
resume: false
wandb_enabled: false
fsdp_devices: 4
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 25

lr_schedule:
  warmup_steps: 2000
  peak_lr: 3.5e-5
  decay_lr: 3.5e-6
  decay_steps: 78800      # 788 steps/ep × 100

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/00036_20260804_RM_01_yj_v21
  assets:
    assets_dir: /home/pi05/00036_20260804_RM_01_yj_v21
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
