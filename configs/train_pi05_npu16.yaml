# π0.5 training on 16× Ascend 910 NPU (DDP via torchrun)
config_name: pi05_aloha
framework: pytorch

exp_name: 00036_PI05_npu16_bs256_lr1e-4_ah50
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 256          # TOTAL across 16 NPUs = 16 per NPU
num_epochs: 100
seed: 42
num_workers: 16
log_interval: 50

save_every_epochs: null
save_interval: 1000       # ~19 ckpts × 20GB = ~380GB
save_full_every_epochs: null
keep_period: 5000
overwrite: true
resume: false
wandb_enabled: false
fsdp_devices: 16
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path: /home/pi05/models

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 1000
  peak_lr: 1.0e-4         # sqrt scaling: 2.5e-5 × sqrt(16)
  decay_lr: 1.0e-5
  decay_steps: 20000      # ≈ total steps (19700) for full cosine decay

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

data:
  repo_id: /home/pi05/00036_20260804_RM_01_yj_v21
  assets:
    assets_dir: /home/pi05/00036_20260804_RM_01_yj_v21
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
