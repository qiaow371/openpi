# 00073 / 4×PPU(GPU5-8) / 显存拉满配方。
# 实测 bs64/卡：peak_reserved≈56.4GB / 96GB。按 peak≈7.5+0.76*local_bs 外推，
# 96/卡 → peak≈81GB，留 ~15GB 碎片余量。112/卡会顶到 ~93GB，OOM 风险高。
# LR：同卡数下线性缩放 64→96 ⇒ 1.0e-4→1.5e-4；warmup 按样本数对齐 2000*(256/384)≈1334。
# cosine decay_steps 由 num_epochs 自动设成 resolved num_train_steps（约 50600）。
config_name: pi05_aloha
framework: pytorch
exp_name: pi05_73_4gpu_bs384_chunk15_lr1.5e-4_20260910
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets
batch_size: 384
num_epochs: 100
seed: 42
num_workers: 8
log_interval: 100
save_every_epochs: 3
keep_period: 1518
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 4
ema_decay: 0.99
pytorch_training_precision: bfloat16
pytorch_weight_path: /workspace/openpi/models/pi05_fixed
model:
  action_horizon: 15
lr_schedule:
  warmup_steps: 1334
  peak_lr: 1.5e-4
  decay_lr: 1.5e-5
optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0
data:
  repo_id: /workspace/openpi/datasets/00073_20260818_RM_01_yj_21
  assets:
    assets_dir: /workspace/openpi/datasets/00073_20260818_RM_01_yj_21
    asset_id: "."
  default_prompt: "Using both hands, pick up the courier items from the green conveyor belt. Place the white courier bags into the left box and the brown courier boxes into the right box."
  prompt_from_task: true
  prompt_from_subtask: false
  adapt_to_pi: false
  delta_action_dims: [7, 7, -1, -1]
