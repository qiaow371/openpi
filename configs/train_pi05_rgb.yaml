# 本机 π0.5 消融：只训练 RGB（三路 cam_mid / cam_left / cam_right）
#
# 矩阵（各一份 YAML，config_name 必须对上）:
#   1. RGB                         configs/train_pi05_rgb.yaml
#   2a. RGB + DEPTH HEAD           configs/train_pi05_rgb_depth_head.yaml
#   2b. RGB + DEPTH LEFT WRIST     configs/train_pi05_rgb_depth_left.yaml
#   2c. RGB + DEPTH RIGHT WRIST    configs/train_pi05_rgb_depth_right.yaml
#   3. RGB + FT                    configs/train_pi05_rgb_ft.yaml
#   4a. RGB + DEPTH HEAD + FT      configs/train_pi05_rgb_depth_head_ft.yaml
#   4b. RGB + DEPTH LEFT + FT      configs/train_pi05_rgb_depth_left_ft.yaml
#   4c. RGB + DEPTH RIGHT + FT     configs/train_pi05_rgb_depth_right_ft.yaml
#
# HEAD = cam_mid；LEFT = cam_left；RIGHT = cam_right。三路 RGB 始终进网，只换 DEPTH。
# 用法:
#   python scripts/train_from_yaml.py --config configs/train_pi05_rgb.yaml --dry-run
#   uv run scripts/compute_norm_stats.py --config-name pi05_aloha_rgb --dataset-dir /path/to/lerobot

config_name: pi05_aloha_rgb
framework: jax

exp_name: REPLACE_ME_rgb
project_name: openpi
checkpoint_base_dir: ./checkpoints
assets_base_dir: ./assets

batch_size: 32
num_epochs: 100
seed: 42
num_workers: 6
log_interval: 100
save_every_epochs: 10
save_full_every_epochs: 20
keep_period: 5000
overwrite: false
resume: false
wandb_enabled: false
fsdp_devices: 1
ema_decay: 0.99

pytorch_training_precision: bfloat16
pytorch_weight_path:

model:
  action_horizon: 50

lr_schedule:
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

# cigai20-ft-depth LeRobot 根目录。本档不读 depth PNG、不走 Force6DEncoder。
data:
  repo_id: /REPLACE/ME/lerobot_ft_depth
  assets:
    assets_dir: /REPLACE/ME/lerobot_ft_depth
    asset_id: "."
  default_prompt: "With both hands, pick up the yellow banana and the yellow lemon and put them into the black box; then take the green vegetables and place them into the blue box."
  prompt_from_task: true
  prompt_from_subtask: false
  # 只训 RGB：没有额外模态，开了也不会插 token。
  append_modality_prompt: false
  modality_prompt_tags: {}
  adapt_to_pi: false
  # TongBot 16D: 左7 | 右7 | 左爪 abs | 右爪 abs
  delta_action_dims: [7, 7, -1, -1]
  # 两组归一化，不要给每个相机单独选：
  #   visual_norm  RGB + DEPTH 同一套（SigLIP：uint8→[-1,1]）。DEPTH 毫米范围由 compute_norm_stats 的 q01/q99 决定；max_depth_mm 只在还没有 stats 时当后备。
  #   vector_norm  state + action + FT 同一套。quantile=π0.5 默认；zscore=π0。
  visual_norm: siglip
  max_depth_mm: 4000.0  # 仅无 depth_mm stats 时的后备上限，不是训练时的硬裁
  vector_norm: quantile
